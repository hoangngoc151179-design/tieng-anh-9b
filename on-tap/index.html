<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ôn tập mỗi ngày · Tiếng Anh</title>
<link rel="stylesheet" href="../chung/hoc-tap.css?v=202610241024">
</head>
<body>
<header><a href="../index.html">🏠 Trang chủ</a><div class="t2">🔥 Ôn tập mỗi ngày</div></header>
<main>
 <div class="card" id="dau">
  <div class="row" style="justify-content:space-between">
   <div><h2>Mỗi ngày 15 câu, khoảng 10 phút</h2><div class="mute">Câu em làm đúng, vài ngày sau cô mới hỏi lại. Câu em làm sai, mai cô hỏi lại ngay và ghi vào Sổ lỗi sai.</div></div>
   <div style="text-align:center"><div class="lua">🔥</div><b id="chuoi">0</b> <span class="mute">ngày liên tiếp</span></div>
  </div>
 </div>
 <div class="card" id="cau"></div>
 <div class="row" id="dieu" style="justify-content:flex-end"><button class="btn" id="tiep" style="display:none">Câu tiếp theo →</button></div>
</main>
<script src="ngan-hang.js?v=202610241024"></script>
<script src="../chung/hoc-tap.js?v=202610241024"></script>
<script>
const NH=window.NGANHANG||[], BY=Object.fromEntries(NH.map(x=>[x.id,x])), S=SoLoi, GOC="../", SO_CAU=15, MOI_TOI_DA=10;
const cauEl=document.getElementById("cau"), tiep=document.getElementById("tiep");
document.getElementById("chuoi").textContent=S.chuoi();
const tron=a=>{ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
function taoPhien(soCau){
  const d=S.doc(), srs=d.srs||{}, hn=S.homNay();
  const co=NH.filter(x=>S.daHoc(x.bai));
  const den=co.filter(x=>srs[x.id]&&srs[x.id].han<=hn).sort((a,b)=>srs[a.id].han<srs[b.id].han?-1:1);
  const moi=tron(co.filter(x=>!srs[x.id]));
  let ids=den.slice(0,soCau).map(x=>x.id);
  ids=ids.concat(moi.slice(0,Math.min(MOI_TOI_DA,soCau-ids.length)).map(x=>x.id));
  if(ids.length<soCau){ const them=co.filter(x=>!ids.includes(x.id)&&srs[x.id]).sort((a,b)=>srs[a.id].han<srs[b.id].han?-1:1); ids=ids.concat(them.slice(0,soCau-ids.length).map(x=>x.id)); }
  if(ids.length<soCau) ids=ids.concat(moi.filter(x=>!ids.includes(x.id)).slice(0,soCau-ids.length).map(x=>x.id));   // vẫn thiếu thì lấy thêm câu mới
  return {ngay:hn, ids:tron(ids), i:0, dung:0, xong:false};
}
let ph, them=false;
function batDau(){
  const d=S.doc();
  if(!NH.some(x=>S.daHoc(x.bai))){ cauEl.innerHTML=`<h2>Em chưa học bài nào</h2><p class="mute">Ôn tập lấy câu hỏi từ những bài em đã học. Em vào Trang chủ, học một bài trong sách trước nhé.</p><a class="btn" href="../index.html">🏠 Về Trang chủ</a>`; return; }
  if(d.phien&&d.phien.ngay===S.homNay()&&!them){ ph=d.phien; } else { ph=taoPhien(them?10:SO_CAU); if(!them){ d.phien=ph; S.luu(d); } }
  if(ph.xong&&!them) return ketThuc();
  hien();
}
function luuPhien(){ if(them) return; const d=S.doc(); d.phien=ph; S.luu(d); }
function hien(){
  if(ph.i>=ph.ids.length) return ketThuc();
  const x=BY[ph.ids[ph.i]]; tiep.style.display="none";
  cauEl.innerHTML=`<div class="row" style="justify-content:space-between"><b>Câu ${ph.i+1}/${ph.ids.length}</b><span class="mute">Đúng ${ph.dung}</span></div><div class="prog"><div style="width:${ph.i/ph.ids.length*100}%"></div></div><div id="o"></div>`;
  S.veCau(x, document.getElementById("o"), GOC, ok=>{ if(ok){ ph.dung++; S.dung(x.id); } else S.sai(x.id); ph.i++; luuPhien();
    tiep.style.display=""; tiep.textContent=ph.i>=ph.ids.length?"Xem kết quả →":"Câu tiếp theo →"; });
}
tiep.onclick=()=>{ hien(); scrollTo(0,0); };
function ketThuc(){
  let so=S.chuoi(); if(!them){ ph.xong=true; luuPhien(); so=S.xongHomNay(); document.getElementById("chuoi").textContent=so; }
  const n=S.soLoiConLai();
  cauEl.innerHTML=`<div style="text-align:center"><div class="lua">🔥</div><h2>${them?"Em đã ôn thêm xong!":"Hoàn thành bài ôn hôm nay!"}</h2>
   <div class="big">${ph.dung}/${ph.ids.length}</div><p class="mute">câu đúng · chuỗi <b>${so}</b> ngày liên tiếp</p>
   ${n?`<p>📕 Sổ lỗi sai của em còn <b>${n}</b> câu cần sửa.</p><a class="btn" href="so-loi.html">Mở Sổ lỗi sai</a>`:`<p>📕 Sổ lỗi sai trống – giỏi lắm!</p>`}
   <div class="row" style="justify-content:center;margin-top:12px"><button class="btn ghost" id="themNua">Ôn thêm 10 câu</button><a class="btn ghost" href="../index.html">🏠 Trang chủ</a></div>
   <p class="mute" style="margin-top:10px">Mai em quay lại ôn tiếp để giữ chuỗi 🔥 nhé!</p></div>`;
  tiep.style.display="none";
  document.getElementById("themNua").onclick=()=>{ them=true; batDau(); };
}
batDau();
</script>
</body>
</html>
